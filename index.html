<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Demonstration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      background: #f5f7fa;
      color: #172033;
    }

    main {
      width: 100%;
      max-width: 900px;
      padding: 40px 24px;
      text-align: center;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
    }

    .video-container {
      aspect-ratio: 16 / 9;
      margin-top: 24px;
      overflow: hidden;
      border-radius: 12px;
      background: #000000;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    a {
      color: #2458b8;
    }
  </style>
</head>

<body>
  <main>
    <h1>Research Demonstration</h1>

    <div class="video-container">
      <iframe
        src="https://www.youtube.com/embed/wat4SlyJSHs"
        title="Research demonstration video"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>

    <p>
      <a
        href="https://www.youtube.com/embed/wat4SlyJSHs"
        target="_blank"
        rel="noopener noreferrer">
        Watch on YouTube
      </a>
    </p>
  </main>
</body>
</html>
